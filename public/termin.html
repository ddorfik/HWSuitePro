<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f4c5c" />
  <title>Termin bestätigen</title>
  <style>
    :root {
      --bg: #eef2f3;
      --surface: #ffffff;
      --ink: #0f1c21;
      --muted: #64748b;
      --line: #e2e8ea;
      --brand: #0f4c5c;
      --brand-2: #12657a;
      --ok: #15803d;
      --ok-soft: #dcfce7;
      --warn: #b45309;
      --warn-soft: #fef3c7;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --radius: 16px;
      --font: "Segoe UI", system-ui, -apple-system, "Inter", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 22px 16px 40px;
      font-family: var(--font); color: var(--ink); background: var(--bg);
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      -webkit-font-smoothing: antialiased;
    }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--brand); font-weight: 700; letter-spacing: .02em; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px; background: var(--brand); color: #fff;
      display: grid; place-items: center; font-size: 17px;
    }
    .card {
      width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: 0 1px 2px rgba(15,28,33,.04), 0 10px 30px rgba(15,28,33,.06);
      overflow: hidden;
    }
    .card-head { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); background: #fbfcfc; }
    .card-head .kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .card-head h1 { margin: 6px 0 0; font-size: 21px; line-height: 1.25; }
    .card-body { padding: 20px 22px; }
    .when {
      display: flex; gap: 14px; align-items: center; padding: 16px;
      background: var(--brand); color: #fff; border-radius: 12px; margin-bottom: 18px;
    }
    .when .date { font-size: 26px; font-weight: 700; line-height: 1; }
    .when .time { font-size: 15px; opacity: .9; margin-top: 4px; }
    .when .dow { margin-left: auto; font-size: 13px; text-align: right; opacity: .85; }
    dl { margin: 0; display: grid; grid-template-columns: 118px 1fr; gap: 10px 12px; font-size: 14px; }
    dt { color: var(--muted); }
    dd { margin: 0; font-weight: 600; word-break: break-word; }
    .hint { font-size: 13px; color: var(--muted); margin-top: 16px; line-height: 1.5; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    button {
      font-family: inherit; font-size: 15px; font-weight: 600; border-radius: 11px; cursor: pointer;
      padding: 14px 16px; border: 1px solid transparent; transition: background .15s, border-color .15s;
    }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-2); }
    .btn-ghost { background: #fff; border-color: var(--line); color: var(--ink); }
    .btn-ghost:hover { border-color: #cbd5d9; }
    .btn:disabled { opacity: .6; cursor: default; }
    textarea {
      width: 100%; min-height: 84px; resize: vertical; padding: 12px; border-radius: 11px;
      border: 1px solid var(--line); font-family: inherit; font-size: 14px; margin-top: 10px;
    }
    textarea:focus { outline: 2px solid rgba(15,76,92,.25); border-color: var(--brand); }
    .state { border-radius: 12px; padding: 16px; margin-bottom: 18px; font-size: 14px; line-height: 1.5; }
    .state strong { display: block; font-size: 16px; margin-bottom: 4px; }
    .state.ok { background: var(--ok-soft); color: var(--ok); }
    .state.warn { background: var(--warn-soft); color: var(--warn); }
    .state.error { background: var(--danger-soft); color: var(--danger); }
    .contact { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); line-height: 1.7; }
    .contact a { color: var(--brand); text-decoration: none; font-weight: 600; }
    .loading { display: grid; place-items: center; min-height: 180px; color: var(--muted); font-size: 14px; gap: 12px; }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line);
      border-top-color: var(--brand); animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    footer { font-size: 12px; color: var(--muted); text-align: center; max-width: 520px; }
  </style>
</head>
<body>
  <div class="brand"><span class="brand-mark">✓</span><span id="brand-name">Terminbestätigung</span></div>

  <div class="card">
    <div class="card-head">
      <div class="kicker" id="kicker">Ihr Termin</div>
      <h1 id="headline">Termin wird geladen …</h1>
    </div>
    <div class="card-body" id="body">
      <div class="loading"><div class="spinner"></div><div>Einen Moment bitte …</div></div>
    </div>
  </div>

  <footer id="footer">Bitte prüfen Sie den Termin und geben Sie uns kurz Bescheid.</footer>

<script type="module" src="/termin.js?v=1.4.1"></script>
</body>
</html>

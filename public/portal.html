<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f4c5c" />
  <link rel="stylesheet" href="/branding.css?v=1.8.0" />
  <title>Kundenportal</title>
  <style>
    :root {
      --bg: #eef2f3; --surface: #fff; --ink: #0f1c21; --muted: #64748b; --line: #e2e8ea;
      --brand: #0f4c5c; --brand-2: #12657a; --ok: #15803d; --ok-soft: #dcfce7;
      --warn: #b45309; --warn-soft: #fef3c7; --danger: #b91c1c; --danger-soft: #fee2e2;
      --radius: 16px; --font: "Segoe UI", system-ui, -apple-system, "Inter", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 22px 16px 40px; font-family: var(--font);
      color: var(--ink); background: var(--bg); display: flex; flex-direction: column;
      align-items: center; gap: 14px; -webkit-font-smoothing: antialiased;
    }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--brand); font-weight: 700; }
    .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); color: #fff; display: grid; place-items: center; }
    .card {
      width: 100%; max-width: 680px; background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: 0 1px 2px rgba(15,28,33,.04), 0 10px 30px rgba(15,28,33,.06);
      overflow: hidden;
    }
    .card-head { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); background: #fbfcfc; }
    .kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    h1 { margin: 6px 0 0; font-size: 21px; line-height: 1.25; }
    .sub { margin-top: 5px; font-size: 13px; color: var(--muted); }
    .card-body { padding: 18px 22px 22px; display: grid; gap: 16px; }
    section { border: 1px solid var(--line); border-radius: 13px; overflow: hidden; }
    section h2 {
      margin: 0; padding: 11px 14px; font-size: 13px; background: #f8fafb;
      border-bottom: 1px solid var(--line); letter-spacing: .01em;
    }
    .row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 11px 14px; border-bottom: 1px solid #f1f5f6; font-size: 13.5px;
    }
    .row:last-child { border-bottom: 0; }
    .row .main { min-width: 0; }
    .row b { display: block; font-size: 13.5px; }
    .row small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .badge {
      display: inline-flex; align-items: center; padding: 4px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 650; background: #eef2f3; color: #475569; white-space: nowrap;
    }
    .badge.ok { background: var(--ok-soft); color: var(--ok); }
    .badge.warn { background: var(--warn-soft); color: var(--warn); }
    .badge.danger { background: var(--danger-soft); color: var(--danger); }
    .amount { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
    a.link { color: var(--brand); font-weight: 650; text-decoration: none; }
    .btn {
      display: inline-block; padding: 9px 13px; border-radius: 9px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); font: inherit; font-size: 13px; font-weight: 650; cursor: pointer;
      text-decoration: none; text-align: center;
    }
    .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    textarea, input {
      width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
      font-family: inherit; font-size: 14px; background: #fff;
    }
    textarea { min-height: 90px; resize: vertical; }
    textarea:focus, input:focus { outline: 2px solid rgba(15,76,92,.22); border-color: var(--brand); }
    .hint { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
    .state { border-radius: 12px; padding: 16px; font-size: 14px; line-height: 1.55; }
    .state.ok { background: var(--ok-soft); color: var(--ok); }
    .state.error { background: var(--danger-soft); color: var(--danger); }
    .state strong { display: block; font-size: 16px; margin-bottom: 4px; }
    .loading { display: grid; place-items: center; min-height: 180px; color: var(--muted); gap: 12px; font-size: 14px; }
    .spinner { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--brand); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { font-size: 12px; color: var(--muted); text-align: center; max-width: 640px; line-height: 1.6; }
    @media (max-width: 520px) {
      body { padding: 16px 10px 32px; }
      .card-body { padding: 14px 14px 18px; }
      .card-head { padding: 17px 16px 14px; }
      .row { padding: 10px 11px; }
    }
  </style>
</head>
<body>
  <div class="brand"><span class="brand-mark">🏠</span><span id="brand-name">Kundenportal</span></div>

  <div class="card">
    <div class="card-head">
      <div class="kicker" id="kicker">Ihre Übersicht</div>
      <h1 id="headline">Kundenportal</h1>
      <div class="sub" id="subtitle">Daten werden geladen …</div>
    </div>
    <div class="card-body" id="body">
      <div class="loading"><div class="spinner"></div><div>Einen Moment bitte …</div></div>
    </div>
  </div>

  <footer id="footer">Dieser Link ist persönlich. Bitte geben Sie ihn nicht weiter.</footer>
<script type="module" src="/portal.js?v=1.7.0"></script>
  <script type="module" src="/branding.js?v=1.8.0"></script>
</body>
</html>

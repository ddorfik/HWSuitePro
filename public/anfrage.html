<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f4c5c" />
  <title>Anfrage senden</title>
  <style>
    :root {
      --bg: #eef2f3; --surface: #fff; --ink: #0f1c21; --muted: #64748b; --line: #e2e8ea;
      --brand: #0f4c5c; --brand-2: #12657a; --ok: #15803d; --ok-soft: #dcfce7;
      --danger: #b91c1c; --danger-soft: #fee2e2; --radius: 16px;
      --font: "Segoe UI", system-ui, -apple-system, "Inter", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 22px 16px 40px; font-family: var(--font);
      color: var(--ink); background: var(--bg); display: flex; flex-direction: column;
      align-items: center; gap: 14px; -webkit-font-smoothing: antialiased;
    }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--brand); font-weight: 700; }
    .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); color: #fff; display: grid; place-items: center; }
    .card {
      width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: 0 1px 2px rgba(15,28,33,.04), 0 10px 30px rgba(15,28,33,.06);
      overflow: hidden;
    }
    .card-head { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); background: #fbfcfc; }
    .kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    h1 { margin: 6px 0 0; font-size: 21px; line-height: 1.25; }
    .card-body { padding: 20px 22px; }
    .form-grid { display: grid; gap: 12px; }
    .field label { display: block; font-size: 12.5px; font-weight: 650; margin-bottom: 5px; }
    .field input, .field textarea, .field select {
      width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
      font-family: inherit; font-size: 14px; background: #fff;
    }
    .field textarea { min-height: 110px; resize: vertical; }
    .field input:focus, .field textarea:focus, .field select:focus {
      outline: 2px solid rgba(15,76,92,.22); border-color: var(--brand);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hint { font-size: 13px; color: var(--muted); line-height: 1.5; }
    button {
      width: 100%; margin-top: 16px; font-family: inherit; font-size: 15px; font-weight: 650;
      border-radius: 11px; cursor: pointer; padding: 14px 16px; border: 1px solid transparent;
      background: var(--brand); color: #fff;
    }
    button:disabled { opacity: .6; cursor: default; }
    .state { border-radius: 12px; padding: 16px; font-size: 14px; line-height: 1.55; margin-bottom: 6px; }
    .state.ok { background: var(--ok-soft); color: var(--ok); }
    .state.error { background: var(--danger-soft); color: var(--danger); }
    .state strong { display: block; font-size: 16px; margin-bottom: 4px; }
    .loading { display: grid; place-items: center; min-height: 160px; color: var(--muted); gap: 12px; font-size: 14px; }
    .spinner { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--brand); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { font-size: 12px; color: var(--muted); text-align: center; max-width: 540px; }
    @media (max-width: 460px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="brand"><span class="brand-mark">✉</span><span id="brand-name">Anfrage senden</span></div>

  <div class="card">
    <div class="card-head">
      <div class="kicker">Kontakt</div>
      <h1>Wie können wir helfen?</h1>
    </div>
    <div class="card-body" id="body">
      <div class="loading"><div class="spinner"></div><div>Formular wird geladen …</div></div>
    </div>
  </div>

  <footer>Ihre Daten werden ausschließlich zur Bearbeitung Ihrer Anfrage verwendet.</footer>
<script type="module" src="/anfrage.js?v=1.7.0"></script>
</body>
</html>
